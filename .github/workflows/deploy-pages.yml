name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: cd web && NODE_OPTIONS=--disable-wasm-trap-handler npm run build

    - name: Upload artifact for Cloudflare Pages
      uses: actions/upload-artifact@v4
      with:
        name: pages-dist
        path: web/dist
        retention-days: 1

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: 195728e627f02c9a0c5b12633ae74c5b
        projectName: dramaforge-app
        directory: web/dist
        branch: main
